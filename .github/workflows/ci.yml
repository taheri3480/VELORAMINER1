name: Velora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: velora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: synchronize npm lockfile [skip ci]'
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - run: npm ci
      - name: Report dependency security audit
        if: always()
        run: |
          npm audit --json > /tmp/velora-audit-all.json || true
          npm audit --omit=dev --json > /tmp/velora-audit-prod.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const [label, path] of [['all dependencies','/tmp/velora-audit-all.json'], ['production dependencies','/tmp/velora-audit-prod.json']]) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            console.log(label + ':', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable, via:item.via, effects:item.effects}));
            }
          }
          NODE
      - name: Enforce dependency security thresholds
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high
      - name: Start dev server for auth invariant
        run: |
          npm run dev > /tmp/velora-dev.log 2>&1 &
          echo $! > /tmp/velora-dev.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/__app-env >/tmp/velora-app-env.json; then exit 0; fi
            sleep 2
          done
          cat /tmp/velora-dev.log
          exit 1
      - run: npm run check:auth
      - name: Stop dev server
        if: always()
        run: if [ -f /tmp/velora-dev.pid ]; then kill $(cat /tmp/velora-dev.pid) || true; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
